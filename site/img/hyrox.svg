<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <defs>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16110d"/>
      <stop offset="0.5" stop-color="#2b231c"/>
      <stop offset="1" stop-color="#16110d"/>
    </linearGradient>
    <radialGradient id="sombra" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16110d" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#16110d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="420" fill="url(#piso)"/>

  <!-- Raias diagonais da arena (inspirado na foto oficial do evento) -->
  <g transform="rotate(-18 200 210)">
    <g stroke="#fffaf4" stroke-opacity="0.26" stroke-width="3">
      <path d="M-120 60 H520"/>
      <path d="M-120 160 H520"/>
      <path d="M-120 260 H520"/>
      <path d="M-120 360 H520"/>
      <path d="M-120 460 H520"/>
    </g>
    <g fill="#fffaf4" fill-opacity="0.38" font-family="'Arial Black', Arial, sans-serif"
       font-weight="900" font-size="24" letter-spacing="7">
      <text x="20" y="128">HYROX</text>
      <text x="230" y="128">HYROX</text>
      <text x="120" y="228">HYROX</text>
      <text x="330" y="228">HYROX</text>
      <text x="30" y="328">HYROX</text>
      <text x="240" y="328">HYROX</text>
      <text x="130" y="428">HYROX</text>
    </g>
  </g>

  <!-- Sombra suave atrás da marca central -->
  <ellipse cx="200" cy="212" rx="195" ry="100" fill="url(#sombra)"/>

  <!-- Wordmark + acento laranja -->
  <text x="200" y="228" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="76" font-weight="900" letter-spacing="5" fill="#fffaf4">HYROX</text>
  <rect x="138" y="250" width="124" height="9" fill="#de6b1d"/>
</svg>
